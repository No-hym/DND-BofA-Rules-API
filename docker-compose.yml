services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_rules}
      POSTGRES_USER: ${POSTGRES_USER:-rules}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-rules-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rules} -d ${POSTGRES_DB:-dnd_rules}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rules}:${POSTGRES_PASSWORD:-local-rules-change-me}@db:5432/${POSTGRES_DB:-dnd_rules}?sslmode=disable
      HTTP_ADDR: :8080
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  seed:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["goose -dir /app/db/migrations postgres \"$DATABASE_URL\" up && /app/rules import --dir /app/data/catalog"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rules}:${POSTGRES_PASSWORD:-local-rules-change-me}@db:5432/${POSTGRES_DB:-dnd_rules}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data:
