name: Sync open content sources

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Catalog version (default: UTC date)'
        required: false
        default: ''
      publish_release:
        description: 'Publish a versioned GitHub Release asset'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Fetch pinned open snapshots (ETL only)
        run: python3 scripts/sync_sources.py fetch
      - name: Build layered catalog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION=$(date -u +%Y%m%d); fi
          python3 scripts/sync_sources.py build --version "$VERSION"
          echo "CATALOG_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish catalog metadata to embedded API contract
        run: cp data/api/catalog-meta.json internal/api/catalog_meta.json
      - name: Validate all catalog layers
        run: |
          python3 scripts/sync_sources.py verify
          python3 -m unittest discover -s scripts/tests
          go run ./cmd/rules validate --dir data/catalog
          go run ./cmd/rules stats --dir data/catalog > /tmp/catalog-stats.json
      - name: Package verified catalog
        run: python3 scripts/package_release.py --version "$CATALOG_VERSION" --out "catalog-v${CATALOG_VERSION}.tar.gz"
      - name: Upload catalog artifact
        uses: actions/upload-artifact@v5
        with:
          name: catalog-v${{ env.CATALOG_VERSION }}
          path: |
            catalog-v${{ env.CATALOG_VERSION }}.tar.gz
            docs/catalog-stats.md
            data/releases/v${{ env.CATALOG_VERSION }}.json
          if-no-files-found: error
      - name: Publish versioned release asset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "catalog-v${CATALOG_VERSION}" "catalog-v${CATALOG_VERSION}.tar.gz" \
            --title "DND-BofA catalog v${CATALOG_VERSION}" \
            --notes-file docs/catalog-stats.md --verify-tag || \
          gh release upload "catalog-v${CATALOG_VERSION}" "catalog-v${CATALOG_VERSION}.tar.gz" --clobber
      - name: Open a review PR with catalog changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/catalog-sync-${{ env.CATALOG_VERSION }}
          title: 'catalog: sync open sources v${{ env.CATALOG_VERSION }}'
          body-path: docs/catalog-stats.md
          commit-message: 'catalog: refresh verified bilingual catalog v${{ env.CATALOG_VERSION }}'
          add-paths: |
            data/catalog
            data/normalized
            data/translated
            data/translations/memory.json
            data/releases
            data/api
            data/sources
            internal/api/catalog_meta.json
            docs/catalog-stats.md
          labels: catalog
          delete-branch: true
